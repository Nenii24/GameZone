<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Formulario</title>
</head>

<body>
    <header id="Inicio">
        <a href="/index.html" title="Regresar al inicio">Volver</a>
        <h3>¡Únete a la comunidad!</h3>
        <p>Registra tus datos para acceder a la plataforma</p>
    </header>

    <hr>
    
    <main>
    <h2>Formulario de registro</h2>

    <form id="form-registro" action="/registro" method="post" novalidate>
        <section id="datos-personales">
            <h3>Datos personales</h3>
            <p>
                <label for="nombre">Nombre: </label><br>
                <input type="text" id="nombre" name="nombre" placeholder="Ingresa tu nombre">
                <span class="error-msg" id="error-nombre" style="color: red; font-size: 0.85rem; display: block;"></span>
            </p>
            <p>
                <label for="apellido">Apellido: </label><br>
                <input type="text" id="apellido" name="apellido" placeholder="Ingresa tu apellido">
                <span class="error-msg" id="error-apellido" style="color: red; font-size: 0.85rem; display: block;"></span>
            </p>
            <p>
                <label for="edad">Edad: </label><br>
                <input type="number" id="edad" name="edad" min="18" max="100">
                <span class="error-msg" id="error-edad" style="color: red; font-size: 0.85rem; display: block;"></span>
            </p>
            <p>
                <label for="nacionalidad">Nacionalidad</label><br>
                <input type="text" id="nacionalidad" name="nacionalidad" list="lista-paises" placeholder="Selecciona tu pais">
                <datalist id="lista-paises">
                    <option value="Mexico"></option>
                    <option value="Estados Unidos"></option>
                    <option value="Canada"></option>
                </datalist>
                <span class="error-msg" id="error-nacionalidad" style="color: red; font-size: 0.85rem; display: block;"></span>
            </p>
            <section id="sexo">
                <legend>Sexo: </legend>
                <input type="radio" id="sexo-m" name="sexo" value="masculino">
                <label for="sexo-m">Masculino</label><br>
                <input type="radio" id="sexo-f" name="sexo" value="femenino">
                <label for="sexo-f">Femenino</label><br>
                <input type="radio" id="sexo-otro" name="sexo" value="otro">
                <label for="sexo-otro">Otro</label><br>
                <span class="error-msg" id="error-sexo" style="color: red; font-size: 0.85rem; display: block;"></span>
            </section>   
        </section>
        <br>
        <section id="datos-cuenta">
            <h3>Datos de la cuenta</h3>
            <p>
                <label for="gamertag">Gamertag: </label>
                <input type="text" id="gamertag" name="gamertag" placeholder="Ingrese su Gamertag">
                <span class="error-msg" id="error-gamertag" style="color: red; font-size: 0.85rem; display: block;"></span>
            </p>
            <p>
                <label for="correo">Correo electrónico: </label><br>
                <input type="email" id="correo" name="correo" placeholder="correo@ejemplo.com">
                <span class="error-msg" id="error-correo" style="color: red; font-size: 0.85rem; display: block;"></span>
            </p>
            <p>
                <label for="password">Contraseña: </label><br>
                <input type="password" id="password" name="password" placeholder="********">
                <span class="error-msg" id="error-password" style="color: red; font-size: 0.85rem; display: block;"></span>
            </p>
        </section>
        <br>
        <section id="preferencia-plataforma">
            <h3>Preferencia de Videojuegos</h3>
            <p>
                <label for="plataforma">Plataforma Principal</label><br>
                <select id="plataforma" name="plataforma">
                    <option value="">Selecciona una opción</option>
                    <option value="pc">PC</option>
                    <option value="switch">Nintendo Switch</option>
                    <option value="playstation">PlayStation</option>
                    <option value="xbox">Xbox</option>
                </select>
                <span class="error-msg" id="error-plataforma" style="color: red; font-size: 0.85rem; display: block;"></span>
            </p>
        </section>
        <br>
        <section id="preferencia-juego">
            <h3>Género de videojuegos preferidos</h3><br>
            <input type="checkbox" id="gen-pelea" name="generos" value="pelea">
            <label for="gen-pelea">Pelea</label><br>
            <input type="checkbox" id="gen-shooter" name="generos" value="shooter">
            <label for="gen-shooter">Disparos</label><br>
            <input type="checkbox" id="gen-rpg" name="generos" value="rpg">
            <label for="gen-rpg">RPG</label><br>
            <span class="error-msg" id="error-generos" style="color: red; font-size: 0.85rem; display: block;"></span>
        </section>
        <br>
        <div>
            <button type="submit">Registrarte</button>
        </div>
    </form>
</main>

<!-- Llama al script principal como módulo -->
<script type="module" src="main.js"></script>
    
    <hr>

    <footer>
        <p>© GameZone 2026® - Tu página de gaming - DASC</p>
    </footer>
</body>
